<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>限定背景合併候選清單｜Wu Jacky</title><style>
:root{font-family:system-ui,sans-serif;color:#493713;background:#fffbed}body{max-width:1100px;margin:auto;padding:24px 16px;line-height:1.8}h1{font-size:28px}a{color:#81570c}input{font:inherit;padding:12px;width:100%;box-sizing:border-box;border:1px solid #dac98b;border-radius:8px;background:white}details{margin:14px 0;border:1px solid #dfcf9d;border-radius:10px;background:#fffef8;overflow:hidden}summary{padding:16px;cursor:pointer;background:#fff0b7}summary strong{display:block}summary small{display:block;color:#77623c}.content{padding:16px}.records{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.record{border-top:1px solid #e6dbb9;min-width:0;padding-top:12px;overflow-wrap:anywhere}.record img{width:100%;height:170px;object-fit:contain;background:#f6edcd}.record p{font-size:13px}.notice{padding:14px;background:#ffedaa;border-radius:8px}button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid #ad7c0e} [hidden]{display:none!important}@media(min-width:850px){.records{grid-template-columns:repeat(3,minmax(0,1fr))}}</style>
<header><a href="../backgrounds.html">← 返回限定背景圖鑑</a><h1>其他活動：合併候選清單</h1><p>2026-10-24 · 44 組比較選項 · 全部尚未修改</p></header><p class="notice">本輪只完成遠古復甦。以下逐組供你決定「合併／保留」；同系列、不同城市與不同年度不代表圖片相同。日期是現有紀錄最早日；卡數採全部收錄。減量為核准後 N→1 的展示減量，重疊選項不可相加。</p><p>每組展開可查看八項比較資料，以及各款圖片、中英文寶可夢、編號與原始卡片。部分取得途徑仍待確認，已逐組註明。</p><label>搜尋候選編號、活動或寶可夢<input id="search" type="search" placeholder="例如 C15、Unova、伊布"></label><p id="status" role="status">載入中…</p><main id="groups"></main><p><a href="background-grouping-candidates-2026-10-24.md">完整文字紀錄</a> · <a href="background-grouping-candidates-2026-10-24.json">原始比較資料</a></p>
<script type="module">
const host=document.getElementById('groups'),search=document.getElementById('search'),status=document.getElementById('status');const n=(tag,text,cls)=>{let el=document.createElement(tag);if(text!=null)el.textContent=text;if(cls)el.className=cls;return el};
try{const response=await fetch('background-grouping-candidates-2026-10-24.json');if(!response.ok)throw Error();let data=await response.json();for(const g of data.candidates){let box=n('details');box.id=g.code;let summary=n('summary');summary.append(n('strong',g.code+' '+g.name_zh+'｜'+g.name_en),n('small',`${g.first_date} · 現有 ${g.card_count} 張 · ${g.recommendation} · 核准歸一可減 ${g.possible_reduction} 張`));let content=n('div',null,'content');for(const text of [`圖片差異：${g.art} ${g.image_comparison}`,`建議與原因：${g.recommendation}。${g.reason}`,`預計減量：核准歸一為 ${g.card_count} → 1，少 ${g.possible_reduction} 張；維持獨立為 0。`,`缺漏／尚待確認：${g.uncertainties}`])content.append(n('p',text));let records=n('div',null,'records');for(const r of g.records){let card=n('article',null,'record'),img=n('img');img.src=r.artwork.url;img.alt=r.name_zh;img.loading='lazy';img.referrerPolicy='no-referrer';card.append(img,n('strong',r.background_id+' '+r.name_zh),n('p',r.name_en+' · '+r.start_date+' · '+r.type));const names=ps=>ps.map(p=>'#'+String(p.dex).padStart(4,'0')+' '+p.name_zh+' '+p.name_en).join('；')||'無／未列';card.append(n('p','原始遇見：'+names(r.pokemon)),n('p','進化／合體：'+names(r.evolved_pokemon)));let link=n('a','查看目前原始卡片 ↗');link.href='../backgrounds.html?background='+encodeURIComponent(r.background_id);link.target='_blank';link.rel='noopener';card.append(link);records.append(card)}content.append(records);box.append(summary,content);box.dataset.search=JSON.stringify(g).normalize('NFKC').toLowerCase();host.append(box)}const filter=()=>{let q=search.value.normalize('NFKC').trim().toLowerCase(),visible=0;for(const box of host.children){box.hidden=!box.dataset.search.includes(q);if(!box.hidden)visible++}status.textContent=`顯示 ${visible} / ${data.candidates.length} 組；目前沒有套用任何其他活動合併。`};search.oninput=filter;filter();if(location.hash){const target=document.getElementById(location.hash.slice(1));if(target)target.open=true}}catch{status.textContent='清單載入失敗，請開啟下方完整文字紀錄。'}
</script></html>
