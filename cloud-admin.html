<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Wu Jacky｜雲端測試後台</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#172b3d;background:#eff3f7;font-size:16px}*{box-sizing:border-box}body{margin:0}main{max-width:1000px;margin:auto;padding:20px}header,.bar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:24px;margin:8px 0}h2{font-size:20px}p{line-height:1.65}.muted{color:#627286}.card{background:white;border:1px solid #dbe3ed;border-radius:16px;padding:20px;margin:18px 0}.badge{background:#e5edff;color:#2653a5;border-radius:99px;padding:6px 12px;font-size:13px}button,input,select,textarea{font:inherit}button{background:#245fd0;color:white;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;min-height:46px}button.alt{background:#e9eef5;color:#1b3553}button:disabled{opacity:.5;cursor:wait}label{display:grid;gap:7px;font-weight:600}input,select,textarea{width:100%;padding:12px;border:1px solid #b9c9da;border-radius:9px;background:white;color:#172b3d;min-width:0}form{display:grid;gap:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}[hidden]{display:none!important}.notice{padding:12px 16px;background:#e8effb;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere}.error{background:#fff0ed;color:#a82e22}.product{padding:16px 0;border-bottom:1px solid #e3eaf2}.product:last-child{border:0}.product strong{font-size:17px}.product small{display:block;margin-top:5px;color:#627286}.actions{display:flex;gap:10px;flex-wrap:wrap}#loginCard{max-width:480px;margin:40px auto}dialog{width:min(660px,calc(100% - 24px));max-height:90dvh;overflow:auto;border:1px solid #dbe3ed;border-radius:18px;padding:20px}dialog::backdrop{background:#0b1e3880}.session{font-size:13px;overflow-wrap:anywhere}@media(max-width:600px){main{padding:12px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:16px}.actions button{flex:1}h1{font-size:21px}}
</style></head><body><main>
<header><div><span class="badge">雲端測試後台</span><h1>Wu Jacky Pokémon GO</h1></div><div class="actions"><a href="admin.html">本機原型</a><button id="logout" class="alt" hidden>登出</button></div></header>
<p class="muted">目前連接測試環境。正式賣場不受此處操作影響。</p>
<p id="message" class="notice" role="status" aria-live="polite">正在載入登入功能…</p>
<section id="loginCard" class="card"><h2>管理員登入</h2><p class="muted">使用已建立並獲得授權的測試帳號。</p><form id="loginForm"><label>電子郵件<input id="email" name="email" type="email" autocomplete="username" required></label><label>密碼<input id="password" name="password" type="password" autocomplete="current-password" required></label><button id="loginButton" disabled>登入</button></form></section>
<section id="workspace" hidden><div class="card"><div class="bar"><div><h2>商品管理</h2><p id="session" class="session muted"></p></div><div class="actions"><button id="reload" class="alt">重新載入</button><button id="addProduct">＋ 新增商品</button></div></div><p class="muted">此頁最多顯示 200 筆商品。庫存請使用「調整庫存」，每筆異動會保留原因。</p><div id="productList"></div></div></section>
<dialog id="productDialog"><div class="bar"><h2 id="productTitle">新增商品</h2><button type="button" class="alt" id="closeProduct">關閉</button></div><form id="productForm"><div class="grid"><label>商品編號 *<input name="sku" maxlength="80" required></label><label>中文名稱 *<input name="name_zh" maxlength="100" required></label><label>英文名稱<input name="name_en" maxlength="100"></label><label>售價（NT$；空白表示詢價）<input name="public_price_twd" type="number" min="0" max="2147483647" step="1"></label><label>上架狀態<select name="publication_status"><option value="draft">草稿</option><option value="published">上架</option><option value="archived">封存</option></select></label><label>供貨狀態<select name="supply_status"><option value="inquiry_only">供貨待確認</option><option value="available">可供貨</option><option value="low_stock">庫存偏低</option><option value="sold_out">已售罄</option><option value="coming_soon">即將推出</option></select></label><label class="full">商品說明<textarea name="description_public" maxlength="1000" rows="4"></textarea></label></div><button id="saveProduct">儲存到雲端</button></form></dialog>
<dialog id="stockDialog"><div class="bar"><h2>調整庫存</h2><button type="button" class="alt" id="closeStock">關閉</button></div><p id="stockName"></p><form id="stockForm"><label>增減數量（增加填正數、減少填負數）<input id="stockDelta" type="number" min="-2147483648" max="2147483647" step="1" required></label><label>異動原因<input id="stockReason" minlength="3" maxlength="120" required></label><p id="stockMessage" class="notice" role="status" hidden></p><button id="saveStock">確認異動</button></form></dialog>
<noscript><p class="notice error">請開啟 JavaScript 才能使用管理後台。</p></noscript>
</main><script type="module" src="assets/cloud-admin.bundle.js"></script></body></html>
