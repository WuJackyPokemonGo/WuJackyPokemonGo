name: Daily product share sync
# 每天台灣時間 10:00、14:00、18:00、22:00 同步商品清單（含商品縮圖與商品資料備份），替新上架的商品產生分享頁與橫式預覽圖（貼到 Messenger／LINE／Threads 會顯示商品圖、不切到寶可夢）。
# 背景圖鑑的預覽圖也一併更新（只重做圖片有變的）。
# 沒有變化就不提交。推送後啟動「先檢查再部署」（GITHUB_TOKEN 推送不會自動觸發部署）。
on:
  schedule:
    - cron: '7 2,6,10,14 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  actions: write
concurrency:
  group: main-data-writer
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow
      # 商品縮圖改由 GitHub Pages 提供，避免超過 Supabase 免費方案的流量額度。
      - run: node scripts/list-public-thumbnails.mjs > "$RUNNER_TEMP/thumbnail-paths.txt"
      - run: python3 scripts/sync-thumbnails.py "$RUNNER_TEMP/thumbnail-paths.txt"
      - run: npm run sync:product-shares
      # 商品資料備份：Supabase 無法連線時，網站改讀這份。
      - run: node scripts/snapshot-catalog.mjs
      - run: python3 scripts/build-og-images.py
      - run: npm run build
      - run: npm test
      - name: Commit and push when product shares changed
        id: commit
        run: |
          if git diff --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "No product share changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Daily sync of product share pages"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # 機器人推送不會自動觸發其他 workflow，所以直接啟動「先檢查再部署」。
      # 如果 Pages 還是「從分支發布」，改用舊方式請 Pages 重新建置。
      - name: Deploy after checks
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-pages.yml --ref main || echo "::warning::Could not start the deploy workflow."
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null 2>&1 || true
